    <title>Business Brain — decide what your marketing should do next</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      /* Business Brain — Nocturne product identity is the default first paint
         (matte warm charcoal, warm off-white, Hanken Grotesk). Legal/verify
         surfaces paint their own scoped paper background over this. */
      body { font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; background: #1b1916; color: #ece7dd; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    </style>

  <body>
    <div id="root">
      <noscript>
        <main style="max-width:720px;margin:0 auto;padding:40px 24px;line-height:1.6">
          <h1>Decide what your marketing should do next. Then actually do that.</h1>
          <p>Business Brain learns your business, helps you commit to one marketing bet, and keeps that
            decision in front of the work — until it changes for a reason. A website is not required: if you
            market through Instagram or can describe your business in your own words, you can still start.</p>
          <p>It works in four steps: <strong>Business</strong> (it gets to know your business and shows what it
            understands), <strong>Strategy</strong> (it helps you make one marketing choice and name the
            trade-off), <strong>Today</strong> (it turns that decision into the next thing worth doing), and
            <strong>Create</strong> (when a move is worth turning into an asset, it can make it).</p>
          <p>What it doesn’t do yet: it doesn’t publish or schedule for you, doesn’t learn from your results
            yet, has no trend engine, and doesn’t replace a marketing team.</p>
          <p><a href="/signin">Start with your business</a></p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
